services:
  webhook-bench:
    build: .
    image: v01dst/webhook-bench:1.0.0
    container_name: webhook-bench
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_PATH: /app/data/webhooks.db
      RETENTION_HOURS: ${RETENTION_HOURS:-24}
    volumes:
      - webhook-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  webhook-data:
